# Local IMAP/SMTP server for integration tests:
#   docker compose -f compose.test.yaml up -d
#   DEPESHA_IT=1 cargo test -p depesha-core --test greenmail --test dovecot
# Plain ports 3025/3143; TLS ports 3465/3993 use GreenMail's self-signed certificate.
# Named so every checkout and worktree drives the same containers and ports.
name: depesha
services:
  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.setup.test.smtps -Dgreenmail.setup.test.imaps
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=alice:secret@local.test,bob:secret@local.test,carol:secret@local.test
        -Dgreenmail.users.login=local_part
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
      - "127.0.0.1:3465:3465"
      - "127.0.0.1:3993:3993"
  # Dovecot 2.4: refuses cleartext login, so tests use STARTTLS on 31143 with the
  # image's self-signed certificate pinned. Any user name, password "secret".
  # The ACL plugin and a read-only "shared/" namespace are added for #42; see
  # docker/dovecot-acl.conf. The "seed" service fills that namespace before it starts.
  dovecot:
    image: dovecot/dovecot:latest
    environment:
      USER_PASSWORD: "{PLAIN}secret"
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./docker/dovecot-acl.conf:/etc/dovecot/conf.d/zz-acl.conf:ro
      - dovecot-shared:/srv/vmail/shared
    ports:
      - "127.0.0.1:31143:31143"
      - "127.0.0.1:31993:31993"
  # The same Dovecot without UIDPLUS in its capabilities (#113): a plain EXPUNGE is the
  # only way to wipe messages there. STARTTLS on 31144, same login as above.
  dovecot-no-uidplus:
    image: dovecot/dovecot:latest
    environment:
      USER_PASSWORD: "{PLAIN}secret"
    volumes:
      - ./docker/dovecot-no-uidplus.conf:/etc/dovecot/conf.d/zz-no-uidplus.conf:ro
    ports:
      - "127.0.0.1:31144:31143"
  # The dovecot image has no shell tools, so the shared namespace is seeded from a
  # busybox one: a ReadOnly folder whose dovecot-acl grants `anyone` lookup and read.
  # Runs to completion on every `up` (idempotent: mkdir -p, files written again).
  seed:
    image: busybox:latest
    volumes:
      - ./docker/dovecot-seed.sh:/seed.sh:ro
      - dovecot-shared:/shared
    command: ["sh", "/seed.sh"]

volumes:
  dovecot-shared:

