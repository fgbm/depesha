[package]
name = "depesha"
description = "Депеша — почтовый клиент для любого IMAP/SMTP-сервера"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "depesha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
depesha-core = { version = "0.8.0", path = "../crates/depesha-core" }
keyring = "4.2.0"
# HMAC-SHA256 for the links the app signs (`install_secret`); already in the tree with
# depesha-core's TLS, so no new crate is pulled in.
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
# `deep-link`: a second launch (a `depesha://` toast click) is forwarded to the first
# instance as a deep-link event before the callback runs.
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-updater = "2.13.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Parsing the `depesha://` URLs of toast clicks (the deep-link plugin's own type).
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Clicks on a notification come back over D-Bus (`ActionInvoked`).
notify-rust = "4.18.1"
# The tray through StatusNotifierItem (KDE, GNOME with AppIndicator, XFCE…) without
# libayatana-appindicator: tauri asks for that backend, ksni wins when both are on.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4.18.1"
# Printing a letter's sheet (#70): `window.print()` does nothing in the WKWebView, so the sheet is
# printed from a web view of its own through AppKit. Already in the tree with tauri and wry.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPrintInfo", "NSPrintOperation", "NSWindow", "NSView", "NSResponder", "NSApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSGeometry", "NSDictionary", "NSObject", "NSValue", "NSRunLoop", "NSDate"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
# Toasts with a click back into the app, and clearing them on exit.
tauri-winrt-notification = "0.8.1"
# The toast XML is built through the DOM (`XmlDocument`, `SetInnerText`) so a subject
# cannot inject markup; `UI_Notifications` shows it and clears it on exit.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }

# The mock runtime for the window tests of `drops`. Not on Windows: a test binary built with
# it does not start there (CI: STATUS_ENTRYPOINT_NOT_FOUND).
[dev-dependencies]
depesha-core = { path = "../crates/depesha-core", features = ["ts"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
# The samples of the golden test of the error texts build the core's errors from these.
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
rusqlite = "0.40.2"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }

[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }

# Has its own main: AppKit wants the main thread (see the file). Empty on other systems.
[[test]]
name = "mac_print"
harness = false

[features]
# Test builds for e2e/run.mjs: files under the folders in DEPESHA_E2E_ROOT count as
# chosen by the user, since WebDriver cannot answer system dialogs. Never in a release.
e2e = []
