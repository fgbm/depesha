[package]
name = "depesha"
description = "Депеша — почтовый клиент для любого IMAP/SMTP-сервера"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "depesha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
depesha-core = { version = "0.1.0", path = "../crates/depesha-core" }
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
