[package]
name = "depesha-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mail engine of Depesha: IMAP sync, SMTP, local cache with full-text search, MIME parsing"

[lints]
workspace = true

[dependencies]
ammonia = "4.2.0"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hickory-resolver = "0.26.3"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
idna = "1.1.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
mail-parser = "0.11.9"
md-5 = "0.11.0"
md4 = "0.11.0"
psl = "2.1.241"
psl-types = "2.0.11"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ring = "0.17.14"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1.44"
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"], optional = true }
x509-parser = "0.18.1"

[dev-dependencies]
# Tests count the statements and commits an operation runs.
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "trace"] }
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"

[features]
# TypeScript types of the interface are generated from the structs (#143); only the tests of the app build them.
ts = ["dep:ts-rs"]

[package.metadata.cargo-machete]
# `md-5` is imported as `md5` (the library's name differs from the package's), which machete does not see.
ignored = ["md-5"]
