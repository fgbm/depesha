[package]
name = "depesha-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mail engine of Depesha: IMAP sync, SMTP, local cache with full-text search, MIME parsing"

[dependencies]
ammonia = "4.2.0"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hickory-resolver = "0.26.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
mail-parser = "0.11.9"
ring = "0.17.14"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stop-token = "0.7.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
