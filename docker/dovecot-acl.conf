# Test-only Dovecot settings for the integration tests (#42): the ACL plugin and a
# public read-only "shared/" namespace the tests check MYRIGHTS, NOPERM and the owner
# grouping against. Mounted into /etc/dovecot/conf.d/ by compose.test.yaml, which
# Dovecot includes last (`!include_try conf.d/*.conf`). Nothing here changes the
# default mailboxes or the tests that do not look at shared folders.
mail_plugins {
  acl = yes
}

protocol imap {
  mail_plugins {
    imap_acl = yes
  }
}

# The file driver: ACLs live in `dovecot-acl` files under the mailbox and, with
# `acl_globals_dir`, in global files. Without an explicit driver the plugin is loaded
# but refuses MYRIGHTS ("ACL not enabled").
acl_driver = vfile

# A public namespace under /srv/vmail/shared, listed only once it holds a mailbox.
# `mailbox_list_layout = fs` keeps the on-disk names plain ("ReadOnly"), not Maildir++.
namespace shared {
  type = public
  prefix = shared/
  separator = /
  list = children
  mailbox_list_layout = fs
  mail_driver = maildir
  mail_path = /srv/vmail/shared
}
