# Test-only (#113): Dovecot 2.4 takes `imap_capability` as the whole list, not as a
# change to the default one, so this is the default list of the image without UIDPLUS.
# The server still understands UID EXPUNGE; a client that trusts the list does not use it.
imap_capability = IMAP4rev1 LITERAL+ SASL-IR LOGIN-REFERRALS ID ENABLE IDLE SORT SORT=DISPLAY THREAD=REFERENCES THREAD=REFS THREAD=ORDEREDSUBJECT MULTIAPPEND URL-PARTIAL CATENATE UNSELECT CHILDREN NAMESPACE SPECIAL-USE MOVE CONDSTORE QRESYNC LIST-STATUS STATUS=SIZE
# A short command line, so that a thousand scattered UIDs in one command are refused as a
# real server would refuse them: the spared marks must go in batches (#113).
imap_max_line_length = 3072
