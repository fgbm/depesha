StylesPath = styles
MinAlertLevel = suggestion

# Vale: for a file, the LAST section whose glob matches wins and sets BasedOnStyles.
# Broad sections come first, specific overrides and exclusions after.

# Russian text: project rules (docs/style/ru-technical.md).
[README.md]
BasedOnStyles = DepeshaRU

[docs/*.md]
BasedOnStyles = DepeshaRU

[docs/agents/*.md]
BasedOnStyles = DepeshaRU

[docs/style/ru-technical.md]
BasedOnStyles = DepeshaRU

[AGENTS.md]
BasedOnStyles = DepeshaRU

[e2e/README.md]
BasedOnStyles = DepeshaRU

[design/mockups/README.md]
BasedOnStyles = DepeshaRU

[design/references/*.md]
BasedOnStyles = DepeshaRU

# English text: ASD-STE100 rules (docs/style/ste-en.md). After the broad Russian globs.
[README.en.md]
BasedOnStyles = DepeshaEN

[plugins/README.md]
BasedOnStyles = DepeshaEN

[SECURITY.md]
BasedOnStyles = DepeshaEN

[CONTRIBUTING.md]
BasedOnStyles = DepeshaEN

[docs/style/ste-en.md]
BasedOnStyles = DepeshaEN

# Text the project does not edit: generated, third-party and drafts (Markdown only).
[design/mockups/*/**]
BasedOnStyles =

[docs/releases/**]
BasedOnStyles =

[plugins/CHANGELOG.md]
BasedOnStyles =

[PAPERCUTS.md]
BasedOnStyles =

[docs/internal/**]
BasedOnStyles =

[vendor/**]
BasedOnStyles =

[LICENSE-*]
BasedOnStyles =

[.github/**]
BasedOnStyles =

[e2e/fixtures/**]
BasedOnStyles =
