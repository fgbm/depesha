[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
# The patched copy of imap-proto is a dependency, not part of the project: it keeps its own
# manifest, its own edition and its own lints (see vendor/imap-proto/PATCH.md).
exclude = ["vendor/imap-proto"]

[patch.crates-io]
# A copy of imap-proto 0.17.0 with one line changed: the space before a partial body's
# literal is optional (GreenMail leaves it out, and a refused answer breaks the connection).
imap-proto = { path = "vendor/imap-proto" }

[workspace.package]
version = "0.8.8"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fgbm/depesha"
homepage = "https://github.com/fgbm/depesha"

# The rules of #152. CI runs clippy with `-D warnings`, so `warn` fails there; an exception is
# a local `#[allow(…, reason = "…")]` that says why, never a switch-off here.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
allow_attributes_without_reason = "warn"
too_many_lines = "warn"
