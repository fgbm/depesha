name: CI

on:
  # Every branch: the green run on the branch is what a merge needs (scripts/check.sh --ci).
  push:
    branches: ["**"]
  # A branch is tried before it is merged: gh workflow run ci.yml --ref <branch> -f windows_only=true
  workflow_dispatch:
    inputs:
      windows_only:
        description: Only the drop steps on Windows
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a branch takes over from the run of the older one; main and releases run to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

env:
  CARGO_TERM_COLOR: always
  # Анонимные загрузки с Docker Hub ограничены; образы стенда берём через зеркало Google
  IMAGE_PREFIX: mirror.gcr.io/

jobs:
  # What the heavy platform jobs (Windows, macOS) are run for. main, release/** and a manual run: always.
  # A branch: only when it touches what those jobs test (the core and the shell of the app, dependencies, the drop code, their scripts, this file).
  changes:
    name: Which platforms
    runs-on: ubuntu-24.04
    outputs:
      platform: ${{ steps.pick.outputs.platform }}
      build_os: ${{ steps.pick.outputs.build_os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          ALWAYS: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          paths='^(crates/|src-tauri/|Cargo\.(toml|lock)$|package(-lock)?\.json$|src/lib/drops\.ts|e2e/(drops\.mjs|drop-steps\.mjs|native-drop\.ps1|windows-display\.ps1)|\.github/workflows/ci\.yml)'
          platform=false
          if [ "$ALWAYS" = true ]; then
            platform=true
          else
            git fetch --no-tags origin main
            if git diff --name-only "$(git merge-base HEAD origin/main)" HEAD | grep -qE "$paths"; then platform=true; fi
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          if [ "$platform" = true ]; then
            echo 'build_os=["ubuntu-24.04","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'build_os=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi
          echo "platform jobs: $platform"

  check:
    if: ${{ !inputs.windows_only }}
    name: Lint and unit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --all --check
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - run: npm run lint
      - run: scripts/frontend-metrics.sh
      - run: scripts/frontend-invariants.sh
      - run: npx vitest run
      - run: cargo test -p depesha-core
      - run: cargo test -p depesha --lib

  integration:
    if: ${{ !inputs.windows_only }}
    name: Integration (GreenMail, Dovecot)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker compose -f compose.test.yaml up -d
      - name: Wait for servers
        run: python3 scripts/wait-stand.py
      - run: DEPESHA_IT=1 cargo test -p depesha-core --test greenmail --test dovecot

  # The scenario in three parts, each on a machine of its own with its own stand and profile
  # (sections: e2e/shard.mjs, what a part runs: DEPESHA_E2E_SHARD).
  e2e:
    if: ${{ !inputs.windows_only }}
    name: End-to-end GUI (Linux, Xvfb, part ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev \
            webkit2gtk-driver xvfb gnome-keyring libsecret-tools dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - run: docker compose -f compose.test.yaml up -d
      - name: Seed test mailbox
        run: |
          for i in $(seq 30); do python3 e2e/imap_helper.py seed && break; sleep 2; done
      - run: npx tauri build --debug --no-bundle --features e2e
      - name: Run E2E with a session bus and an unlocked keyring
        run: |
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp &
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            DEPESHA_E2E_SHARD=${{ matrix.shard }} WEBKIT_DRIVER=/usr/bin/WebKitWebDriver E2E_DISPLAY=:99 node e2e/run.mjs'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screens-${{ strategy.job-index }}
          path: |
            e2e/screens
            e2e/logs
          if-no-files-found: ignore

  # Files dropped on a letter being written (#79) on a real Windows: the backend makes the
  # window report a drop of real files (`e2e_drop`), the rest of the path is the real one.
  # No mail server here (no Docker on the runner): the mailbox is saved and never logged in to.
  # `scale` 2 asks WebView2 for a device pixel ratio of 2, as on a 200 % screen.
  e2e-windows:
    name: Drop on Windows (${{ matrix.name }})
    # A Windows build and three runs take their time: see `changes` for the branches it is run on.
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: scale 1, scale: 1 }
          # The browser's own scale: the page sees a ratio of 2 on a screen that is at 100 %.
          - { name: scale 2 of the browser, scale: 2 }
          # The system's scale, as on a real screen: the most the runner's display driver allows (175 % at 1920x1080).
          - { name: scale of the system, system: 250 }
    runs-on: windows-latest
    env:
      DEPESHA_LOG: debug,depesha_lib=debug,depesha_core=debug
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo install tauri-driver --locked
      # The system's own scaling (the page's `devicePixelRatio` follows it), which a runner has
      # to be told: its screen is 1024x768 at 100 %. The step itself never fails the job; the run does
      # (`E2E_MIN_DPR`) when the page does not report the scale the step was meant to set.
      - name: Screen at the system scale
        if: matrix.system
        shell: powershell
        continue-on-error: true
        run: e2e\windows-display.ps1 -Percent ${{ matrix.system }}
      - name: msedgedriver of the WebView2 version on the runner
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 $version"
          New-Item -ItemType Directory -Force driver | Out-Null
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile driver\edgedriver.zip
            Write-Host "msedgedriver $version (the exact version of WebView2)"
          } catch {
            # No build of this exact version: the latest release of its major one.
            $major = $version.Split('.')[0]
            # The file is UTF-16 with a BOM: read the bytes, not the decoded text.
            $raw = (Invoke-WebRequest "https://msedgedriver.microsoft.com/LATEST_RELEASE_${major}_WINDOWS").RawContentStream.ToArray()
            $latest = [Text.Encoding]::Unicode.GetString($raw).TrimStart([char]0xFEFF).Trim()
            if ($latest -notmatch '^\d+(\.\d+)+$') { throw "LATEST_RELEASE_${major}_WINDOWS is not a version: '$latest'" }
            Write-Host "no msedgedriver $version ($($_.Exception.Message)); taking $latest, the latest of $major"
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$latest/edgedriver_win64.zip" -OutFile driver\edgedriver.zip
          }
          Expand-Archive driver\edgedriver.zip -DestinationPath driver -Force
          & driver\msedgedriver.exe --version
      - run: npx tauri build --debug --no-bundle --features e2e
      - name: Drop steps
        shell: pwsh
        env:
          NATIVE_DRIVER: ${{ github.workspace }}\driver\msedgedriver.exe
          E2E_EXPECT_DPR: ${{ matrix.scale }}
          E2E_MIN_DPR: ${{ matrix.system && '1.25' || '' }}
        run: |
          if ('${{ matrix.scale }}' -notin '', '1') { $env:DEPESHA_E2E_WEBVIEW_ARGS = '--force-device-scale-factor=${{ matrix.scale }}' }
          node e2e/drops.mjs
      - name: Log of the app
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e\logs | Out-Null
          Copy-Item "$env:APPDATA\ru.depesha.mail\logs\*" e2e\logs -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\ru.depesha.mail\logs\*" e2e\logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-windows-${{ strategy.job-index }}
          path: |
            e2e/screens
            e2e/logs

  build:
    if: ${{ !inputs.windows_only }}
    name: Build ${{ matrix.os }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.build_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev: the packaging step of tauri-cli looks for an
          # appindicator library through pkg-config and aborts without one (the app's
          # tray is ksni, so the library is bundled into the AppImage but unused).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo test -p depesha-core --lib
      # Attachment path spellings (#79): string tests plus one on a real file, which only Windows can run.
      - if: runner.os == 'Windows'
        run: cargo test -p depesha --lib -- "paths::"
      # Packages only; update artifacts need the signing key, which only releases get.
      - run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: error
