# Правило: без канцелярита и пустых вступлений — слова из раздела «Не писать» в docs/glossary.md.
# В Go RE2 \b не работает с кириллицей, поэтому границы слова заданы явно.
extends: existence
message: "Канцелярит: «%s». Перестройте фразу (docs/style/ru-technical.md, раздел 2)."
level: error
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^\p{L}])явля(?:ется|ются|лся|лась|лось|лись)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])осуществл\p{L}*'
  - '(?:^|[^\p{L}])(?:производ|произвед)\p{L}*'
  # Только единственные прилагательные формы: «данные», «данных», «данным» значат "data".
  - '(?:^|[^\p{L}])данн(?:ый|ая|ое|ого|ой|ому|ом|ую)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])в целях(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])в рамках(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])на предмет(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])имеет место(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])в случае,? если(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])следует(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])желательно(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])по возможности(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])при необходимости(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])как правило(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])рекомендуется(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])Знай(?: устройство)?:'
  - '(?:^|[^\p{L}])Помни:'
  - '(?:^|[^\p{L}])Обрати внимание'
  - '(?:^|[^\p{L}])Важно:'
  - '(?:^|[^\p{L}])Стоит отметить'
