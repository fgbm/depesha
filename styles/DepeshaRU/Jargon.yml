# Правило: без жаргона, пиши термин из docs/glossary.md.
# В Go RE2 \b не работает с кириллицей, поэтому границы слова заданы явно.
extends: existence
message: "Жаргон: «%s». Используйте термин из docs/glossary.md."
level: error
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^\p{L}])конфиг\p{L}*'
  - '(?:^|[^\p{L}])реп(?:а|ы|е|у|ой|ам|ах)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])юзер\p{L}*'
  - '(?:^|[^\p{L}])фич(?:а|и|е|у|ей|ам|ах)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])апдейт\p{L}*'
  - '(?:^|[^\p{L}])зали(?:ть|вать|ли|л)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])задепло\p{L}*'
  - '(?:^|[^\p{L}])бэкап\p{L}*'
